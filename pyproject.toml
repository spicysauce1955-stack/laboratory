[project]
name = "laboratory"
version = "0.7.0"
description = "Remote Experiment Runner — reproducible remote jobs with an agent-usable (MCP) interface and live observability."
readme = "README.md"
requires-python = ">=3.12"
# Everything `lab` needs to be a working command once installed. The CLI/MCP deps used to sit in
# a `cli` dependency-group, which was correct while the lab WAS the repo you ran from: the remote
# skipped the group and stayed lean. As an installed package that split is a trap — dependency
# groups are not installed by `pip install`, so the published wheel shipped a `lab` entry point
# that died on `import typer`, and nothing caught it because in-repo `uv sync` installs the group.
# It also no longer buys leanness: the remote syncs the *project's* deps, and the project depends
# on `laboratory`, so these arrive there whether they are core or an extra. Heavy, genuinely
# optional things (clouds, R2, mlflow) stay extras below.
dependencies = [
    "numpy<2",          # spec FR-B2: NumPy <2 pin
    "pydantic>=2",      # shared models (spec §8) + experiment config
    "hydra-core>=1.3",  # experiment config (Experiment Contract §7)
    "typer>=0.12",      # the `lab` CLI (FR-F2)
    "fastmcp>=2",       # the `lab mcp` server (FR-F1)
    "rich>=13",         # terminal dashboard (FR-D3)
    # Machine-local settings (cloud project/credential paths) from the git-ignored .env.
    "python-dotenv>=1",
]

# Remote provisioning backend — deferred until we wire the skypilot backend (P0-remote).
# Install when needed, e.g.:  uv add "skypilot[vast]"   (vast.ai for the GPU/P1 path)
[project.optional-dependencies]
# skypilot>=0.12 pins click<8.2 (which its remote ray runtime requires) — hence the base deps
# also cap click<8.2. skypilot 0.12 uses the newer VastAI().client API, so pin vastai-sdk>=1.0
# (its [vast] extra pin is too loose — leaving it picks an old 0.2.x that lacks .client).
# `pip` is required because SkyPilot shells out to `pip3` locally during Vast provisioning,
# and uv-managed venvs don't include pip by default.
skypilot = ["skypilot[vast]>=0.12", "vastai-sdk>=1.0", "pip"]
# DigitalOcean CPU backend (`--backend cpu`): SkyPilot's DO provisioner + its pydo client.
do = ["skypilot[do]>=0.12", "pydo"]
# Google Cloud (`--cloud gcp`, CPU + GPU): SkyPilot's GCP provisioner (google-api-python-client
# + google-cloud-storage). `pip` for SkyPilot's local pip3 shell-outs (same note as [vast]).
gcp = ["skypilot[gcp]>=0.12", "pip"]
# Durable artifact storage on Cloudflare R2 (S3-compatible) for the lab control plane.
r2 = ["boto3>=1.34"]
# Experiment tracking (opt-in; not needed to run the lab or most experiments).
tracking = ["mlflow>=2"]

[project.scripts]
lab = "lab.cli:main"

[dependency-groups]
# Only what you need to DEVELOP the lab. Everything needed to USE it is a real dependency or an
# extra above, so an installed wheel is never missing a piece. The remote's
# `uv sync --no-default-groups` skips this group — test and lint tools have no business on a
# provisioned box.
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
default-groups = ["dev"]
# Cap click<8.2 as a resolution constraint (not a dependency), decoupled from any group:
# SkyPilot's remote ray runtime crashes on click>=8.2 (and skypilot 0.12 itself requires it).
# As a constraint, click is only installed where something else pulls it (typer), never on the
# lean remote — and the cap survives renaming/removing the `cli` group.
constraint-dependencies = ["click<8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

# The sdist defaults to "every tracked file", which meant a release shipped this repo's research
# bookkeeping — .coverage, formtest_done.json, the run_*.sh drivers, the whole experiments/ tree —
# to anyone who installed from source. A distribution should carry the tool and the things needed
# to build and check it, nothing else. (Most of that content leaves entirely when
# `tempotron-capacity` is extracted; this keeps it out of released artifacts either way.)
[tool.hatch.build.targets.sdist]
include = [
    "src/lab",
    "tests",
    "docs",
    "pyproject.toml",
    "uv.lock",
    "README.md",
    "CHANGELOG.md",
    "LAB-REQUIREMENTS.md",
]
# Archived point-in-time records (a delivery letter, a closed bug ledger, closed field reports).
# They live under docs/ so their history and inbound links survive, but they describe states of
# the world that no longer hold — shipping them to someone installing from source would put stale
# setup instructions in the same tree as current ones.
exclude = ["docs/archive"]

# The scaffold's skill payload must be forced in. `.claude/skills/laboratory` is a symlink into
# `src/lab/_scaffold/project/skills/laboratory` (so this repo's own agent sessions read the same
# file the package ships), and hatchling's sdist walker resolves that symlink and then skips the
# real directory — silently dropping the skill from the sdist. `uv build` with no flags builds the
# wheel FROM the sdist, so every published wheel inherited the hole: v0.5.1 through v0.6.1 shipped
# without the skill, and `lab init` scaffolded no skill at all for anyone installing the package.
# The wheel target's own walker handles the symlink correctly, so forcing it here (and only here)
# fixes both artifacts — adding it to the wheel target as well collides when the wheel is built
# from an sdist that already contains the files. Guarded by
# `test_built_artifacts_carry_the_skill_payload`.
[tool.hatch.build.targets.sdist.force-include]
"src/lab/_scaffold/project/skills" = "src/lab/_scaffold/project/skills"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Research/workload scripts are deliberately terse (semicolon stanzas, scratch variables) and
# aren't lab source. Keep correctness checks (undefined names, syntax) but waive the import- and
# statement-style rules `src/lab` is held to.
"experiments/*" = ["E4", "E7", "F401", "F541", "F841"]
# `experiments/` now holds a single file — example_capacity.py, the lab's own contract fixture.
# The analysis scratch that needed the wider waiver left with tempotron-capacity.
".claude/**" = ["E4", "E7", "F401", "F541", "F841"]

[tool.mypy]
strict = true
files = ["src/lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not packaging'"
markers = [
    "packaging: builds a wheel and installs it into a clean venv (slow; run in CI and at release)",
]
